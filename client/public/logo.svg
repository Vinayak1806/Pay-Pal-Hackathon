<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="6" y1="4" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="logoMeshGrad" x1="12" y1="12" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield -->
    <path
      d="M24 2L42 8.5V22C42 34 34.5 43.5 24 48C13.5 43.5 6 34 6 22V8.5L24 2Z"
      fill="url(#logoShieldGrad)"
    />
    <!-- Inner Shield Rim -->
    <path
      d="M24 5L39 10.5V22C39 32 32.5 40.5 24 44.5C15.5 40.5 9 32 9 22V10.5L24 5Z"
      stroke="#93C5FD"
      stroke-width="1"
      stroke-opacity="0.4"
      fill="none"
    />
    <!-- Mesh Nodes -->
    <circle cx="24" cy="13" r="2" fill="#FFFFFF" />
    <circle cx="15" cy="19" r="1.8" fill="#67E8F9" />
    <circle cx="33" cy="19" r="1.8" fill="#67E8F9" />
    <circle cx="16" cy="31" r="1.8" fill="#67E8F9" />
    <circle cx="32" cy="31" r="1.8" fill="#67E8F9" />
    <circle cx="24" cy="37" r="1.8" fill="#FFFFFF" />
    <!-- Mesh Connections -->
    <path
      d="M24 13 L15 19 M24 13 L33 19 M15 19 L16 31 M33 19 L32 31 M16 31 L24 37 M32 31 L24 37 M15 19 L24 25 M33 19 L24 25 M16 31 L24 25 M32 31 L24 25 M24 13 L24 25 M24 25 L24 37"
      stroke="url(#logoMeshGrad)"
      stroke-width="1.3"
      stroke-linecap="round"
      stroke-opacity="0.85"
    />
    <!-- Central Core -->
    <circle cx="24" cy="25" r="4.2" fill="#0F172A" stroke="#67E8F9" stroke-width="1.5" />
    <path
      d="M22.5 25.2L23.7 26.4L26 23.8"
      stroke="#38BDF8"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Brand Typography -->
  <text x="62" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
    SpendMesh <tspan fill="#2563EB">AI</tspan>
  </text>
  <text x="62.5" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.08em" fill="#64748B">
    FINANCIAL ESCROW &amp; POLICY LAYER
  </text>
</svg>
