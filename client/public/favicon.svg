<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Contour -->
  <path
    d="M32 4L54 12V28C54 42.5 44.5 54.2 32 60C19.5 54.2 10 42.5 10 28V12L32 4Z"
    fill="url(#shieldGrad)"
  />

  <!-- Subtle Inner Shield Rim -->
  <path
    d="M32 7.5L50.5 14.5V28C50.5 40.5 42.2 50.8 32 56C21.8 50.8 13.5 40.5 13.5 28V14.5L32 7.5Z"
    stroke="#93C5FD"
    stroke-width="1.2"
    stroke-opacity="0.5"
    fill="none"
  />

  <!-- Neural Mesh Grid / Interlocking Nodes -->
  <!-- Top apex node -->
  <circle cx="32" cy="17" r="2.5" fill="#FFFFFF" />
  <!-- Left upper node -->
  <circle cx="21" cy="24" r="2.2" fill="#67E8F9" />
  <!-- Right upper node -->
  <circle cx="43" cy="24" r="2.2" fill="#67E8F9" />
  <!-- Left lower node -->
  <circle cx="23" cy="38" r="2.2" fill="#67E8F9" />
  <!-- Right lower node -->
  <circle cx="41" cy="38" r="2.2" fill="#67E8F9" />
  <!-- Bottom apex node -->
  <circle cx="32" cy="46" r="2.2" fill="#FFFFFF" />

  <!-- Connecting Mesh Lines -->
  <path
    d="M32 17 L21 24 M32 17 L43 24 M21 24 L23 38 M43 24 L41 38 M23 38 L32 46 M41 38 L32 46 M21 24 L32 31 M43 24 L32 31 M23 38 L32 31 M41 38 L32 31 M32 17 L32 31 M32 31 L32 46"
    stroke="url(#meshGrad)"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.85"
  />

  <!-- Central Security / Escrow Vault Core -->
  <circle cx="32" cy="31" r="5" fill="#0F172A" stroke="#67E8F9" stroke-width="1.8" filter="url(#glow)" />
  <path
    d="M30 31.2L31.5 32.7L34.5 29.5"
    stroke="#38BDF8"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
